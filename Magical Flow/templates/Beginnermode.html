<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magical Flow - AI Compose (Beginner)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #030008;
            color: #ffffff;
        }
        .mono-text {
            font-family: 'Fira Code', monospace;
        }
        .brand-heading {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #ffffff 0%, #e9d5ff 50%, #c084fc 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .card-bg {
            background: linear-gradient(145deg, rgba(15, 8, 30, 0.85) 0%, rgba(3, 0, 8, 0.95) 100%);
        }
        .card-border {
            border: 1px solid rgba(139, 92, 246, 0.2);
            transition: all 0.35s ease-in-out;
        }
        .card-border:focus-within, .card-border:hover {
            border-color: rgba(168, 85, 247, 0.5);
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.2);
        }
        .glow-button {
            background: linear-gradient(135deg, #9333ea 0%, #6b21a8 100%);
            box-shadow: 0 0 20px rgba(147, 51, 234, 0.4);
            transition: all 0.3s ease;
        }
        .glow-button:hover {
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.7);
            transform: translateY(-1px);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between bg-[#030008] text-white relative overflow-x-hidden selection:bg-purple-500 selection:text-white">

    <!-- Top Navigation Bar Header -->
    <header class="w-full bg-[#030008] border-b border-purple-950/40">
        <div class="max-w-[1400px] mx-auto px-6 py-4 flex items-center justify-between z-20">
            <!-- Brand Logo & Name -->
            <a href="{{ url_for('home') }}" class="flex items-center gap-2.5 group">
                <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo" class="w-7 h-7 object-contain group-hover:scale-105 transition-transform" onerror="this.src='https://via.placeholder.com/28/9333ea/ffffff?text=MF'">
                <span class="font-extrabold text-base tracking-wide text-white group-hover:text-purple-300 transition-colors">Magical Flow</span>
            </a>

            <!-- Navigation Links -->
            <nav class="hidden md:flex items-center gap-6 text-xs text-zinc-300 font-medium">
                <a href="{{ url_for('signin') }}" class="hover:text-purple-300 transition-colors">Login</a>
                <a href="{{ url_for('register') }}" class="hover:text-purple-300 transition-colors">Register</a>
                <a href="{{ url_for('home') }}" class="hover:text-purple-300 transition-colors">Home</a>
                <a href="{{ url_for('select_mode') }}" class="hover:text-purple-300 transition-colors">Mode</a>
                <a href="{{ url_for('beginner_mode') }}" class="text-purple-400 font-bold border-b border-purple-400 pb-0.5">AI Compose</a>
                <a href="{{ url_for('pro_studio_mode') }}" class="hover:text-purple-300 transition-colors">Pro Studio</a>
                <a href="{{ url_for('beginner_output') }}" class="hover:text-purple-300 transition-colors">AI Output</a>
                <a href="{{ url_for('studio_output') }}" class="hover:text-purple-300 transition-colors">Pro Output</a>
                <a href="{{ url_for('my_music') }}" class="hover:text-purple-300 transition-colors">Library</a>
                <a href="{{ url_for('artist_support') }}" class="text-purple-300 font-bold hover:text-white transition-colors">Support</a>
            </nav>

            <!-- User Profile Avatar Circle -->
            <a href="{{ url_for('account') }}" class="w-8 h-8 rounded-full bg-purple-950/60 border border-purple-500/30 flex items-center justify-center text-purple-200 hover:text-white hover:border-purple-400 transition-all shadow-inner">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
            </a>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="w-full max-w-4xl mx-auto px-6 py-10 flex-grow flex flex-col items-center justify-center z-10">
        
        <!-- Category Badge -->
        <span class="mono-text text-[11px] font-semibold tracking-[0.2em] text-purple-400/90 uppercase mb-3 bg-purple-950/40 border border-purple-500/20 px-3.5 py-1 rounded-full">
            AI COMPOSER
        </span>

        <!-- Page Heading -->
        <h1 class="brand-heading text-3xl md:text-5xl font-extrabold text-center mb-3 tracking-tight">
            Describe Your Song Idea
        </h1>
        <p class="mono-text text-xs text-zinc-400 text-center mb-8 max-w-lg">
            Select your genre, mood, tempo, and vocal choices to generate custom AI music instantly.
        </p>

        <!-- Song Generator Form Card -->
        <form action="{{ url_for('beginner_output') }}" method="POST" class="card-bg card-border rounded-2xl p-6 md:p-8 w-full space-y-6">
            
            <!-- Prompt Input Field -->
            <div>
                <label class="block mono-text text-xs text-purple-300 mb-2 font-semibold tracking-wider uppercase">
                    Song Description / Prompt
                </label>
                <textarea name="prompt" rows="3" required placeholder="e.g., A slow Punjabi sad song with emotional acoustic guitar, dholak beats, and heartfelt male vocals..." class="w-full bg-[#030008]/80 border border-purple-900/60 rounded-xl p-4 text-xs text-white placeholder-zinc-500 focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500 transition-all resize-none"></textarea>
            </div>

            <!-- Parameters Grid -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                
                <!-- Complete Musical Genre Selection (Includes Punjabi) -->
                <div>
                    <label class="block mono-text text-[10px] text-zinc-400 mb-1.5 uppercase font-medium">Genre</label>
                    <select name="genre" class="w-full bg-[#0a0518] border border-purple-900/50 rounded-lg px-3 py-2.5 text-xs text-zinc-200 focus:outline-none focus:border-purple-500">
                        <option value="Punjabi">Punjabi</option>
                        <option value="Punjabi Pop">Punjabi Pop</option>
                        <option value="Punjabi Bhangra">Punjabi Bhangra</option>
                        <option value="Punjabi Sad Ballad">Punjabi Sad / Sufi</option>
                        <option value="Punjabi Folk">Punjabi Folk</option>
                        <option value="Bollywood Pop">Bollywood Pop</option>
                        <option value="Bollywood Sufi">Bollywood Sufi</option>
                        <option value="Modern Pop">Modern Pop</option>
                        <option value="EDM / House">EDM / House</option>
                        <option value="Hip-Hop / Trap">Hip-Hop / Trap</option>
                        <option value="Lo-Fi Chill">Lo-Fi Chill</option>
                        <option value="Cinematic">Cinematic Orchestral</option>
                        <option value="Acoustic / Folk">Acoustic / Folk</option>
                        <option value="Rock / Alternative">Rock / Alternative</option>
                        <option value="R&B / Soul">R&B / Soul</option>
                    </select>
                </div>

                <!-- Complete Mood Selection (Includes Sad Options) -->
                <div>
                    <label class="block mono-text text-[10px] text-zinc-400 mb-1.5 uppercase font-medium">Mood</label>
                    <select name="mood" class="w-full bg-[#0a0518] border border-purple-900/50 rounded-lg px-3 py-2.5 text-xs text-zinc-200 focus:outline-none focus:border-purple-500">
                        <option value="Sad">Sad</option>
                        <option value="Melancholic & Sad">Melancholic & Sad</option>
                        <option value="Heartbreak & Emotional">Heartbreak & Emotional</option>
                        <option value="Sufi Sad & Deep">Sufi Sad & Deep</option>
                        <option value="Nostalgic Sadness">Nostalgic Sadness</option>
                        <option value="Magical & Dreamy">Magical & Dreamy</option>
                        <option value="Romantic & Soulful">Romantic & Soulful</option>
                        <option value="High Energy & Hype">High Energy & Hype</option>
                        <option value="Uplifting & Inspiring">Uplifting</option>
                        <option value="Dark & Dramatic">Dark & Dramatic</option>
                        <option value="Chill & Relaxed">Chill & Relaxed</option>
                    </select>
                </div>

                <!-- Tempo Selection -->
                <div>
                    <label class="block mono-text text-[10px] text-zinc-400 mb-1.5 uppercase font-medium">Tempo</label>
                    <select name="tempo" class="w-full bg-[#0a0518] border border-purple-900/50 rounded-lg px-3 py-2.5 text-xs text-zinc-200 focus:outline-none focus:border-purple-500">
                        <option value="Slow Sad (70 BPM)">Slow Sad (70 BPM)</option>
                        <option value="Mid-Tempo (100 BPM)">Mid (100 BPM)</option>
                        <option value="Upbeat (128 BPM)">Fast (128 BPM)</option>
                        <option value="High Speed (145+ BPM)">High Speed (145 BPM)</option>
                    </select>
                </div>

                <!-- Vocal Type Selection -->
                <div>
                    <label class="block mono-text text-[10px] text-zinc-400 mb-1.5 uppercase font-medium">Vocals</label>
                    <select name="vocals" class="w-full bg-[#0a0518] border border-purple-900/50 rounded-lg px-3 py-2.5 text-xs text-zinc-200 focus:outline-none focus:border-purple-500">
                        <option value="Male Vocalist">Male Vocalist</option>
                        <option value="Female Vocalist">Female Vocalist</option>
                        <option value="Duet (Male & Female)">Male & Female Duet</option>
                        <option value="Instrumental Only">Instrumental Only</option>
                    </select>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="glow-button w-full py-4 rounded-xl font-bold text-xs uppercase tracking-widest text-white flex items-center justify-center gap-2 cursor-pointer mt-4">
                <svg class="w-4 h-4 text-purple-200" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/>
                </svg>
                Generate Track with AI
            </button>
        </form>
    </main>

    <!-- Floating Artist Support Headset Widget -->
    <a href="{{ url_for('artist_support') }}" class="fixed bottom-6 right-6 z-50 group flex items-center justify-center w-14 h-14 bg-[#5b1494] border border-purple-400/50 rounded-full shadow-[0_0_25px_rgba(139,92,246,0.6)] hover:scale-110 hover:border-purple-300 transition-all" title="Artist Support">
        <svg class="w-7 h-7 text-[#facc15]" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 1a9 9 0 0 0-9 9v7a3 3 0 0 0 3 3h3a1 1 0 0 0 1-1v-6a1 1 0 0 0-1-1H5v-2a7 7 0 1 1 14 0v2h-4a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.5a.5.5 0 0 1 .5.5v.5a2.5 2.5 0 0 0-2.5 2.5H13a1 1 0 1 0 0 2h1.5A4.5 4.5 0 0 0 19 20.5v-.5a2.5 2.5 0 0 0 2.5-2.5V10a9 9 0 0 0-9-9z"/>
        </svg>
    </a>

</body>
</html>
