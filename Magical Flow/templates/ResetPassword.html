<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magical Flow - Reset Password</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display+SC:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { background-color: #070311; font-family: 'Inter', sans-serif; color: #ffffff; }
        .title-font { font-family: 'Playfair Display SC', serif; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center px-4">
    <div class="max-w-md w-full bg-[#0d071b] border border-purple-900/40 p-8 rounded-2xl shadow-2xl relative overflow-hidden">
        <div class="absolute -top-24 -right-24 w-48 h-48 bg-purple-600/10 rounded-full blur-3xl"></div>
        
        <div class="text-center mb-8">
            <h1 class="title-font text-3xl tracking-wider bg-gradient-to-r from-white via-purple-300 to-fuchsia-400 bg-clip-text text-transparent">Magical Flow</h1>
            <p class="text-xs uppercase tracking-widest text-purple-400 mt-1">Set New Password</p>
        </div>

        {% if error %}
        <div class="mb-4 p-3 bg-red-950/50 border border-red-500/50 text-red-300 text-xs rounded-lg text-center">
            {{ error }}
        </div>
        {% endif %}

        <p class="text-xs text-zinc-400 mb-6 text-center">Enter the recovery code sent to <span class="text-fuchsia-400">{{ email }}</span> and create your new password.</p>

        <form action="/reset-password" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs uppercase tracking-wider text-zinc-400 mb-1">Recovery Code</label>
                <input type="text" name="code" required class="w-full bg-[#120a22] border border-purple-900/50 rounded-lg px-4 py-3 text-sm text-white focus:outline-none focus:border-fuchsia-500 tracking-widest text-center" placeholder="123456">
            </div>

            <div>
                <label class="block text-xs uppercase tracking-wider text-zinc-400 mb-1">New Password</label>
                <input type="password" name="password" required class="w-full bg-[#120a22] border border-purple-900/50 rounded-lg px-4 py-3 text-sm text-white focus:outline-none focus:border-fuchsia-500" placeholder="••••••••">
            </div>

            <div>
                <label class="block text-xs uppercase tracking-wider text-zinc-400 mb-1">Confirm New Password</label>
                <input type="password" name="confirm_password" required class="w-full bg-[#120a22] border border-purple-900/50 rounded-lg px-4 py-3 text-sm text-white focus:outline-none focus:border-fuchsia-500" placeholder="••••••••">
            </div>

            <button type="submit" class="w-full py-3 mt-2 bg-gradient-to-r from-purple-600 to-fuchsia-600 hover:from-purple-500 hover:to-fuchsia-500 text-white font-medium text-sm rounded-lg transition-all shadow-lg shadow-purple-600/30">
                Update Password & Login
            </button>
        </form>
    </div>
</body>
</html>
