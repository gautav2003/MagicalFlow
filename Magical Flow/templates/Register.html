{% extends "Base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="auth-page">
   <div class="auth-card">
      <div class="auth-card-inner">
         <div class="auth-header">
            <div class="auth-logo"> </div>
            <div><strong>Magical Flow</strong><small>Musical Studio App</small></div>
         </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% for cat, msg in messages %}
            <div class="flash flash-{{ cat }}" style="margin-bottom:12px">{{ msg }}</div>
          {% endfor %}
        {% endwith %}

        <div class="auth-title">Create Account</div>
        <form method="POST" action="{{ url_for('register') }}">
          <div class="form-group">
             <label>Username</label>
             <input class="form-control" type="text" name="username" required placeholder="e.g. JohnSmith12">
          </div>
          <div class="form-group">
             <label>Email Address</label>
             <input class="form-control" type="email" name="email" required placeholder="you@email.com">
          </div>
          <div class="form-group">
             <label>Password</label>
             <input class="form-control" type="password" name="password" required placeholder="***************">
          </div> 
          <div 
        </form>
      </div>
   </div>
</div>
