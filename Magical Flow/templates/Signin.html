{% extends "base.html" %}
{% block title %}Sign In{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-card-inner">
      <div class="auth-header">
        <div class="auth-logo"> </div>
        <div>
          <strong>Magical Flow</strong>
          <small>Musical Studio App</small>
        </div>
      </div>
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for cat, msg in messages %}
          <div class="flash flash-{{ cat }}" style="margin-bottom:12px">{{ msg }}</div>
        {% endfor %}
      {% endwith %}

      <div class="auth-split">
        <div class="auth-form">
          <div class="auth-title">Sign In</div>
          <form method="POST" action="{{ url_for('auth.signin') }}">
            <div class="form-group">
               <label>Username</label>
               <input class="form-control" type="text" name="username" value="{{ username|default('') }}" placeholder="Enter your username or email" required> 
            </div>
            <div class="form-group">
               <label>Password</label>
               <div class="pw-row">
                 <input class="form-control" type="password" name="password" placeholder="***************" required>
                 <button type="button" class="pw-toggle" onclick="togglePw()">👁</button>
               </div>
            </div>
            <div class="checkbox-row">
               <input type="checkbox" name="i agree to terms of service" id="lib-check" onchange="toggleLibCode()">
               <label for="lib-check" style="font-weight:normal;cursor:pointer">I agree to the terms of service</label>
            </div>
            <div class="form-group" if="lib-code-group" style="display:none">
               
        </div>
      </div>
    </div>
  </div>




</div>
