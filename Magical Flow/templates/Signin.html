<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magical Flow - Sign In</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #121214; color: #e1e1e6; font-family: system-ui, sans-serif; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">
    <header class="bg-[#18181b] border-b border-[#27272a] px-6 py-4 flex justify-between items-center">
        <a href="{{ url_for('home') }}" class="text-indigo-400 font-bold tracking-wide text-xl">Magical Flow</a>
        <a href="{{ url_for('register') }}" class="text-sm text-zinc-400 hover:text-indigo-400">Need an account? Register</a>
    </header>

    <main class="flex-1 flex items-center justify-center p-6">
        <div class="bg-[#18181b] border border-[#27272a] p-8 rounded-xl w-full max-w-md shadow-2xl">
            <h1 class="text-xl font-bold text-white mb-2">Welcome Back</h1>
            <p class="text-xs text-zinc-400 mb-6">Sign in to access your projects and AI music workstations.</p>

            {% if error %}
            <div class="bg-red-950/50 border border-red-500/50 text-red-300 text-xs p-3 rounded mb-4">
                {{ error }}
            </div>
            {% endif %}

            <form action="{{ url_for('signin') }}" method="POST" class="space-y-4 text-xs">
                <div>
                    <label class="text-zinc-400 block mb-1">Username</label>
                    <input type="text" name="username" required class="w-full bg-[#121214] border border-[#27272a] rounded p-2.5 text-zinc-200 focus:outline-none focus:border-indigo-500" placeholder="PandaIsLive">
                </div>
                <div>
                    <label class="text-zinc-400 block mb-1">Password</label>
                    <input type="password" name="password" required class="w-full bg-[#121214] border border-[#27272a] rounded p-2.5 text-zinc-200 focus:outline-none focus:border-indigo-500" placeholder="••••••••">
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2.5 rounded transition shadow-lg shadow-indigo-900/20 cursor-pointer">
                    Sign In
                </button>
            </form>
        </div>
    </main>

    <footer class="bg-[#18181b] border-t border-[#27272a] text-center py-4 text-xs text-zinc-500">
        &copy; 2026 Magical Flow AI Audio Workstation.
    </footer>
</body>
</html>
