{% extends "base.html" %}
{% block title %}Sign In{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-card-inner">
      <div class="auth-header">
        <div class="auth-logo"> </div>
        <div>
          <strong>Magical Flow</strong>
          <small>Musical Studio App</small>
        </div>
      </div>
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for cat, msg in messages %}
          <div class="flash flash-{{ cat }}" style="margin-bottom:12px">{{ msg }}</div>
        {% endfor %}
      {% endwith %}

      <div class="auth-split">
        <div class="auth-form">
          <div class="auth-title">Sign In</div>
          <form method="POST" action="{{ url_for('auth.signin') }}">
            <div class="form-group">
               <label>Username</label>
               <input class="form-control" type="text" name="username" value="{{ username|default('') }}" placeholder="Enter your username or email" required> 
            </div>
            <div class="form-group">
               
            </div>
        </div>
      </div>
    </div>
  </div>




</div>
