<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magical Flow - Sign In</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #070311; color: #ffffff; min-height: 100vh; overflow-x: hidden; }
        .studio-card { background: linear-gradient(135deg, rgba(26, 11, 51, 0.9) 0%, rgba(12, 4, 25, 0.95) 100%); border: 1px solid rgba(147, 51, 234, 0.4); box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 40px rgba(139, 92, 246, 0.15); }
    </style>
</head>
<body class="flex flex-col min-h-screen justify-between">
    <header class="w-full bg-[#0c0419]/90 border-b border-purple-900/40 px-6 py-3 flex items-center justify-between text-sm sticky top-0 z-50 backdrop-blur">
        <div class="flex items-center space-x-2">
            <div class="w-8 h-8 rounded-full bg-gradient-to-br from-purple-500 to-indigo-600 flex items-center justify-center shadow-lg"><i class="fa-solid fa-music text-xs text-white"></i></div>
            <span class="font-bold tracking-wide text-white">Magical Flow</span>
        </div>
        <nav class="hidden md:flex items-center space-x-5 text-xs text-zinc-300">
            <a href="{{ url_for('signin') }}" class="text-purple-400 font-semibold">Sign in</a>
            <a href="{{ url_for('register') }}" class="hover:text-purple-400">Register</a>
            <a href="{{ url_for('home') }}" class="hover:text-purple-400">Home</a>
        </nav>
        <a href="{{ url_for('signin') }}" class="w-8 h-8 rounded-full bg-purple-950/60 border border-purple-500/40 flex items-center justify-center text-zinc-300"><i class="fa-solid fa-user text-xs"></i></a>
    </header>

    <main class="flex-1 flex items-center justify-center p-6">
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 w-full max-w-5xl">
            <div class="studio-card rounded-2xl p-8 flex flex-col justify-between">
                <div>
                    <div class="flex items-center space-x-2 mb-8">
                        <div class="w-6 h-6 rounded-full bg-purple-600 flex items-center justify-center"><i class="fa-solid fa-music text-[10px]"></i></div>
                        <span class="text-xs text-purple-300 font-medium">Magical Flow</span>
                    </div>
                    <div class="bg-[#080312] border border-purple-500/30 rounded-xl p-4 mb-6 relative overflow-hidden h-48 flex items-center justify-center">
                        <div class="flex items-end space-x-1.5 h-24 z-10">
                            <div class="w-2 bg-blue-400 h-8 rounded-full"></div>
                            <div class="w-2 bg-indigo-400 h-14 rounded-full"></div>
                            <div class="w-2 bg-purple-400 h-20 rounded-full"></div>
                            <div class="w-2 bg-pink-400 h-10 rounded-full"></div>
                            <div class="w-2 bg-amber-400 h-16 rounded-full"></div>
                        </div>
                    </div>
                    <h2 class="text-2xl font-bold text-white mb-2">"Where sound meets imagination"</h2>
                </div>
                <p class="text-xs text-zinc-400">Create, compose, and collaborate. Your music journey starts here.</p>
            </div>

            <div class="studio-card rounded-2xl p-8 flex flex-col justify-between">
                <div>
                    <h1 class="text-2xl font-bold text-white mb-1">Sign in</h1>
                    <p class="text-xs text-zinc-400 mb-6">Return to your creative universe</p>

                    {% if error %}
                    <div class="bg-red-950/60 border border-red-500/50 text-red-300 text-xs p-3 rounded-lg mb-4">{{ error }}</div>
                    {% endif %}

                    <form action="{{ url_for('signin') }}" method="POST" class="space-y-4 text-xs">
                        <div>
                            <label class="text-zinc-400 block mb-1.5 font-medium">Username or Email</label>
                            <input type="text" name="username" required class="w-full bg-[#080312]/80 border border-purple-500/40 rounded-xl p-3 text-zinc-200 focus:outline-none focus:border-purple-400" placeholder="Gautav Sharma">
                        </div>
                        <div>
                            <label class="text-zinc-400 block mb-1.5 font-medium">Password</label>
                            <input type="password" name="password" required class="w-full bg-[#080312]/80 border border-purple-500/40 rounded-xl p-3 text-zinc-200 focus:outline-none focus:border-purple-400" placeholder="••••••••">
                        </div>
                        <button type="submit" class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 text-white font-semibold py-3 rounded-xl transition shadow-lg shadow-purple-900/30 cursor-pointer mt-2">
                            Sign in Securely
                        </button>
                    </form>
                </div>
                <div class="text-center mt-6 text-xs text-zinc-400">
                    No account? <a href="{{ url_for('register') }}" class="text-purple-400 font-semibold hover:underline">Register</a>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
