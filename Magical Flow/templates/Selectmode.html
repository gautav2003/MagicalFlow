<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Mode - Magical Flow</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
      body {
            font-family: 'Inter', sans-serif;
            background-color: #070311;
            color: #ffffff;
        }
        .serif-heading {
            font-family: 'Cinzel', serif;
        }
        .card-bg {
            background: linear-gradient(145deg, rgba(20, 10, 35, 0.7) 0%, rgba(7, 3, 17, 0.9) 100%);
        }
        .card-border {
            border: 1px solid rgba(168, 85, 247, 0.2);
        }
        .card-border:hover {
            border-color: rgba(192, 132, 252, 0.5);
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.15);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between bg-[#070311] text-white relative overflow-x-hidden selection:bg-purple-500 selection:text-white">

    <!-- Top Navigation Bar (Highlighted in your red circle) -->
    <header class="w-full px-6 py-4 flex items-center justify-between border-b border-purple-950/40 bg-[#070311]/90 backdrop-blur-md z-20">
        <!-- Logo & Brand -->
        <a href="{{ url_for('home') }}" class="flex items-center gap-2.5">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo" class="w-8 h-8 object-contain" onerror="this.src='https://via.placeholder.com/32/9333ea/ffffff?text=MF'">
            <span class="font-bold text-sm tracking-wide bg-clip-text text-transparent bg-gradient-to-r from-white via-purple-200 to-pink-400">Magical Flow</span>
        </a> 

        <!-- Nav links -->
        <nav class="hidden lg:flex items-center gap-6 text-xs text-zinc-300 font-medium">
            <a href="{{ url_for('signin') }}" class="hover:text-purple-300 transition-colors">Sign in</a>
            <a href="{{ url_for('register') }}" class="hover:text-purple-300 transition-colors">Register</a>
            <a href="{{ url_for('home') }}" class="hover:text-purple-300 transition-colors">Home</a>
            <a href="{{ url_for('select_mode') }}" class="text-purple-400 font-semibold">Mode</a>
            <a href="{{ url_for('beginner_mode') }}" class="hover:text-purple-300 transition-colors">Beginner</a>
            <a href="{{ url_for('pro_studio_mode') }}" class="hover:text-purple-300 transition-colors">Pro Studio</a>
            <a href="{{ url_for('beginner_output') }}" class="hover:text-purple-300 transition-colors">Beginner output</a>
            <a href="{{ url_for('studio_output') }}" class="hover:text-purple-300 transition-colors">Studio output</a>
            <a href="{{ url_for('my_music') }}" class="hover:text-purple-300 transition-colors">My Music</a>
        </nav> 

        <!-- User Profile Icon -->
        <a href="{{ url_for('account') }}" class="w-8 h-8 rounded-full bg-zinc-900 border border-zinc-800 flex items-center justify-center text-zinc-300 hover:text-white hover:border-purple-500/50 transition-all">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
        </a>
    </header>

    <!-- Main Content Container -->
    <main class="w-full max-w-5xl mx-auto px-6 py-10 flex-grow flex flex-col items-center justify-center z-10">
        
        <!-- Subtitle Label -->
        <span class="text-[11px] font-semibold tracking-[0.2em] text-purple-400/90 uppercase mb-3">
            Select Mode
        </span>

        <!-- Main Title -->
        <h1 class="serif-heading text-3xl md:text-5xl font-normal text-white text-center mb-12 tracking-wide italic">
            How do you want to create ?
        </h1>
