{% extends "Base.html" %}
{% block title %}Magical Flow - Register{% endblock %}
{% block content %}
<div class="flex flex-col items-center justify-center w-full max-w-md mx-auto py-6">
    <div class="studio-card rounded-2xl p-8 w-full space-y-5 relative overflow-hidden border border-purple-500/40">
        
        <div class="text-center space-y-1">
            <h2 class="text-2xl font-bold text-white tracking-tight">Create Account</h2>
            <p class="text-xs text-zinc-400">Begin your brightest creative chapter</p>
        </div>

        {% if error %}
        <div class="bg-red-500/20 border border-red-500 text-red-300 text-xs p-3 rounded-xl text-center">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" class="space-y-4">
            <div>
                <label class="block text-[11px] text-zinc-400 mb-1">Username/ Artist Name</label>
                <input type="text" name="username" required placeholder="Gautav Sharma" 
                    class="w-full bg-[#120822] border border-purple-500/40 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-purple-400">
            </div>

            <div>
                <label class="block text-[11px] text-zinc-400 mb-1">Email Address</label>
                <input type="email" name="email" required placeholder="Gautavsharma11@gmail.com" 
                    class="w-full bg-[#120822] border border-purple-500/40 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-purple-400">
            </div>

            <div>
                <label class="block text-[11px] text-zinc-400 mb-1">Password</label>
                <div class="relative">
                    <input type="password" id="password" name="password" required placeholder="••••••••••••" oninput="checkStrength('password', 'strengthBar', 'strengthText')"
                        class="w-full bg-[#120822] border border-purple-500/40 rounded-xl pl-4 pr-10 py-2.5 text-xs text-white focus:outline-none focus:border-purple-400">
                    <button type="button" onclick="toggleVisibility('password', 'eye_password')" class="absolute right-3 top-1/2 -translate-y-1/2 text-zinc-400 hover:text-white">
                        <i id="eye_password" class="fa-solid fa-eye-slash text-xs"></i>
                    </button>
                </div>
                <div class="w-full bg-zinc-800 h-1 rounded-full mt-2 overflow-hidden">
                    <div id="strengthBar" class="h-full w-0 transition-all duration-300"></div>
                </div>
                <div id="strengthText" class="text-[10px] text-zinc-400 mt-1 text-right"></div>
            </div>

            <div>
                <label class="block text-[11px] text-zinc-400 mb-1">Confirm Password</label>
                <div class="relative">
                    <input type="password" id="confirm_password" name="confirm_password" required placeholder="••••••••••••" oninput="checkStrength('confirm_password', 'confirmStrengthBar', 'confirmStrengthText')"
                        class="w-full bg-[#120822] border border-purple-500/40 rounded-xl pl-4 pr-10 py-2.5 text-xs text-white focus:outline-none focus:border-purple-400">
                    <button type="button" onclick="toggleVisibility('confirm_password', 'eye_confirm')" class="absolute right-3 top-1/2 -translate-y-1/2 text-zinc-400 hover:text-white">
                        <i id="eye_confirm" class="fa-solid fa-eye-slash text-xs"></i>
                    </button>
                </div>
                <div class="w-full bg-zinc-800 h-1 rounded-full mt-2 overflow-hidden">
                    <div id="confirmStrengthBar" class="h-full w-0 transition-all duration-300"></div>
                </div>
                <div id="confirmStrengthText" class="text-[10px] text-zinc-400 mt-1 text-right"></div>
            </div>

            <div class="flex items-center space-x-2 pt-1">
                <input type="checkbox" id="terms" required class="rounded bg-[#120822] border-purple-500/40 text-purple-600 focus:ring-0">
                <label for="terms" class="text-[11px] text-zinc-400">I agree to the Terms of service</label>
            </div>

            <button type="submit" class="w-full bg-gradient-to-r from-purple-700 to-indigo-700 hover:from-purple-600 hover:to-indigo-600 text-white font-semibold text-xs py-3 rounded-xl shadow-lg transition">
                Create Secure Account
            </button>
        </form>
        <div class="relative flex py-1 items-center">
            <div class="flex-grow border-t border-purple-900/50"></div>
            <span class="flex-shrink mx-4 text-zinc-500 text-[10px]">OR</span>
            <div class="flex-grow border-t border-purple-900/50"></div>
        </div>

       <a href="{{ url_for('google_auth') }}" class="w-full flex items-center justify-center space-x-2 bg-[#120822] hover:bg-purple-950/60 border border-purple-500/40 text-white text-xs font-medium py-2.5 rounded-xl transition shadow-md">
            <i class="fa-brands fa-google text-red-400"></i>
            <span>Create with Google</span>
        </a>

        <div class="text-center text-[11px] text-zinc-400 pt-1">
            Already have an account? <a href="{{ url_for('signin') }}" class="text-purple-400 font-semibold hover:underline">Sign in</a>
        </div>
    </div>
</div> 

<script>
function toggleVisibility(inputId, eyeId) {
    const input = document.getElementById(inputId);
    const eye = document.getElementById(eyeId);
    if (input.type === 'password') {
        input.type = 'text';
        eye.classList.remove('fa-eye-slash');
        eye.classList.add('fa-eye');
    } else {
        input.type = 'password';
        eye.classList.remove('fa-eye');
        eye.classList.add('fa-eye-slash');
    }
}

function checkStrength(inputId, barId, textId) {
    const val = document.getElementById(inputId).value;
    const bar = document.getElementById(barId);
    const text = document.getElementById(textId);
    
    let score = 0;
    if (val.length > 5) score++;
    if (val.length > 9) score++;
    if (/[A-Z]/.test(val)) score++;
    if (/[0-9]/.test(val)) score++;
    if (/[^A-Za-z0-9]/.test(val)) score++;

    bar.className = "h-full transition-all duration-300";
    if (val.length === 0) {
        bar.style.width = "0%";
        text.innerText = "";
    } else if (score <= 2) {
        bar.style.width = "25%";
        bar.classList.add("bg-red-500");
        text.innerText = "Weak Password";
        text.className = "text-[10px] text-red-400 mt-1 text-right";
    } else if (score === 3) {
        bar.style.width = "50%";
        bar.classList.add("bg-orange-500");
        text.innerText = "Medium Password";
        text.className = "text-[10px] text-orange-400 mt-1 text-right";
    } else if (score === 4) {
        bar.style.width = "75%";
        bar.classList.add("bg-yellow-400");
        text.innerText = "Strong Password";
        text.className = "text-[10px] text-yellow-300 mt-1 text-right";
    } else {
        bar.style.width = "100%";
        bar.classList.add("bg-green-500");
        text.innerText = "Excellent Password";
        text.className = "text-[10px] text-green-400 mt-1 text-right";
    }
}
</script>
{% endblock %}
