{% extends "Base.html" %}
{% block title %}Magical Flow - Request Recovery{% endblock %}
{% block content %}
<div class="flex flex-col items-center justify-center w-full max-w-md mx-auto py-10">
    <div class="studio-card rounded-2xl p-8 w-full space-y-6 relative overflow-hidden border border-purple-500/40">
        
        <div class="text-center space-y-1">
            <h2 class="text-2xl font-bold text-white tracking-tight">Forgot Password</h2>
            <p class="text-xs text-zinc-400">Enter your email address to receive a recovery code</p>
        </div>

        {% if error %}
        <div class="bg-red-500/20 border border-red-500 text-red-300 text-xs p-3 rounded-xl text-center">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" class="space-y-4">
            <div>
                <label class="block text-[11px] text-zinc-400 mb-1">Email Address</label>
                <input type="email" name="email" required placeholder="Gautavsharma11@gmail.com" 
                    class="w-full bg-[#120822] border border-purple-500/40 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-purple-400">
            </div>

            <button type="submit" class="w-full bg-gradient-to-r from-purple-700 to-indigo-700 hover:from-purple-600 hover:to-indigo-600 text-white font-semibold text-xs py-3 rounded-xl shadow-lg transition">
                Send Recovery Code
            </button>
            <a href="{{ url_for('signin') }}" class="block w-full text-center bg-[#120822] hover:bg-purple-950/60 border border-purple-500/40 text-zinc-300 text-xs font-medium py-2.5 rounded-xl transition">
                Back to Sign In
            </a>
        </form>

    </div>
</div>
{% endblock %}
